<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Делители и кратные: тренажёр</title>
<style>
:root{--bg:#fff;--fg:#1f2a44;--card:#eef3fa;--or:#b8520f;--bl:#2f68ad;--okb:#dff3e4;--okf:#1d6b3a;--badb:#fbe3e0;--badf:#9c2a1f;--line:#c9d4e6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a2b;--fg:#e8ecf5;--card:#212b45;--or:#f0a066;--bl:#8fb8ee;--okb:#17402a;--okf:#9fe0b5;--badb:#4a1f1c;--badf:#f3b1aa;--line:#3a4766;}}
:root[data-theme="dark"]{--bg:#141a2b;--fg:#e8ecf5;--card:#212b45;--or:#f0a066;--bl:#8fb8ee;--okb:#17402a;--okf:#9fe0b5;--badb:#4a1f1c;--badf:#f3b1aa;--line:#3a4766;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.4}
.w{max-width:860px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;gap:16px;align-items:center;flex-wrap:wrap;background:var(--card);border-radius:20px;padding:16px 20px}
header img{width:210px;max-width:40%;border-radius:12px;background:#fff}
header div{flex:1;min-width:200px}
h1{margin:0 0 4px;font-size:26px}h2{margin:0 0 6px;font-size:22px}
.pr{font-weight:700;color:var(--bl);margin-top:8px}
nav{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}
nav button{min-height:44px;padding:0 14px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--fg);font:inherit;font-weight:700;cursor:pointer}
nav button[aria-pressed="true"]{background:var(--bl);border-color:var(--bl);color:#fff}
.lead{margin:0 0 14px}
.item{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px}
.q{margin:0 0 10px;font-weight:700;font-size:18px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.item button,.item input{min-height:44px;border-radius:10px;font:inherit;font-size:17px}
.item button{padding:0 16px;border:0;background:var(--bl);color:#fff;font-weight:700;cursor:pointer}
.item button.g{background:transparent;color:var(--bl);border:2px solid var(--bl)}
.item button:disabled,.item input:disabled{opacity:.55;cursor:default}
.item input{flex:1;min-width:180px;padding:0 12px;border:2px solid var(--line);background:var(--bg);color:var(--fg)}
.item textarea{width:100%;min-height:64px;padding:10px 12px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--fg);font:inherit;font-size:17px;resize:vertical}.item textarea:disabled{opacity:.55}
.hint{margin:8px 0 0;color:var(--or);font-weight:600}
.fb{display:flex;gap:10px;align-items:center;margin-top:10px;padding:8px 12px;border-radius:14px}
.fb[hidden],.hint[hidden],[hidden]{display:none}
.fb img{width:52px;height:52px;border-radius:50%;background:#fff;flex:none}
.fb.ok{background:var(--okb);color:var(--okf)}.fb.bad{background:var(--badb);color:var(--badf)}
.fb span{font-weight:600}
.gw{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;width:100%}.gr{display:grid;gap:6px;flex:none;width:min(100%,360px)}.item .gr button{aspect-ratio:1;min-height:0;padding:0;font-size:clamp(14px,4.5vw,20px);background:var(--bg);color:var(--fg);border:2px solid var(--line)}.item .gr button.s{background:#5b6578;color:#fff;border-color:#5b6578}.item .gr button.y{background:var(--okb);color:var(--okf);border-color:var(--okf)}.item .gr button.n{background:var(--badb);color:var(--badf);border-color:var(--badf)}.item .gr button:disabled{opacity:1}.cnt{background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:12px 16px;font-weight:800;font-size:22px;min-width:180px}.cnt small{display:block;font-weight:600;font-size:15px;margin-top:4px}
#fin{margin-top:16px;padding:16px;border-radius:16px;background:var(--okb);color:var(--okf);font-weight:700;text-align:center}
</style></head><body><div class="w">
